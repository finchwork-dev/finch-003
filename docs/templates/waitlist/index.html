<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumen — Coming soon</title>
<style>:root{--bg:#10131c;--ink:#f1f3fa;--m:#98a0b8;--a:#ffcf5c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;overflow-x:hidden}
.w{max-width:620px;text-align:center}.sun{width:180px;height:180px;margin:0 auto 18px;display:block}h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.1;margin:0 0 14px;letter-spacing:-.03em}p{color:var(--m)}
form{display:flex;gap:8px;margin:26px auto 10px;max-width:440px;flex-wrap:wrap}input{flex:1;min-width:200px;padding:14px 16px;border-radius:10px;border:1px solid #2b3250;background:#171b29;color:var(--ink);font:inherit}button{padding:14px 22px;border:0;border-radius:10px;background:var(--a);color:#241a00;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
.cd{display:flex;justify-content:center;gap:14px;margin:28px 0}.cd div{background:#171b29;border-radius:12px;padding:12px 16px;min-width:76px}.cd b{display:block;font-size:1.8rem}.cd span{font-size:.75rem;color:var(--m)}small{color:#6b7391}</style></head><body><div class="w">

<script>var T=new Date();T.setDate(T.getDate()+30);(function t(){var s=Math.max(0,T-new Date())/1000;d.textContent=Math.floor(s/86400);h.textContent=Math.floor(s%86400/3600);m.textContent=Math.floor(s%3600/60);setTimeout(t,30000)})()</script></body></html>
